version = 1

[[annotations]]
path = [
  "Cargo.lock",
  "Cargo.toml",
  "typst.toml",
  "CHANGELOG.md",
  "LICENSE",
  "LICENSE.md",
  "README.md",
  "REUSE.toml",
  ".gitignore",
  "js/**",
  "py/**",
  "src/**",
  "docs/**",
  "tests/**",
  "typst/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Julian Y. Richard Corbet"
SPDX-License-Identifier = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"

[[annotations]]
path = "LICENSES/LGPL-3.0-only.txt"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "LGPL-3.0-only"

[[annotations]]
path = "LICENSES/GPL-3.0-only.txt"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = "LICENSES/LGPL-3.0-only WITH LGPL-3.0-linking-exception.txt"
SPDX-FileCopyrightText = "Canonical"
SPDX-License-Identifier = "LGPL-3.0-linking-exception"

[[annotations]]
path = ["py/LICENSES/LGPL-3.0-only.txt", "js/@corbet-labs/cbcp/LICENSES/LGPL-3.0-only.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "LGPL-3.0-only"

[[annotations]]
path = ["py/LICENSES/GPL-3.0-only.txt", "js/@corbet-labs/cbcp/LICENSES/GPL-3.0-only.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = ["py/LICENSES/LGPL-3.0-only WITH LGPL-3.0-linking-exception.txt", "js/@corbet-labs/cbcp/LICENSES/LGPL-3.0-only WITH LGPL-3.0-linking-exception.txt"]
precedence = "override"
SPDX-FileCopyrightText = "Canonical"
SPDX-License-Identifier = "LGPL-3.0-linking-exception"
