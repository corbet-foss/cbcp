[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cbcp"
version = "0.1.2"
description = "Deterministic BCP 47 locale-ID casting and vendor code mapping. No models, no I/O: same input always yields the same output"
readme = "README.md"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
license-files = ["LICENSES/*"]
requires-python = ">=3.10"
keywords = ["i18n", "locale", "bcp47"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]


[project.urls]
Homepage = "https://github.com/corbet-foss/cbcp#readme"
Repository = "https://github.com/corbet-foss/cbcp"
Issues = "https://github.com/corbet-foss/cbcp/issues"

[project.scripts]
cbcp = "cbcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["cbcp"]
